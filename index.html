<!DOCTYPE html>
<html>
<head>
<title>TrendyFits - Fashion Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
 box-sizing:border-box;
 font-family:Arial,sans-serif;
}

body{
 margin:0;
 background:#f5f5f5;
}

header{
 background:#111;
 color:white;
 padding:20px;
 text-align:center;
 font-size:30px;
 font-weight:bold;
}

.search{
 padding:15px;
}

.search input{
 width:100%;
 padding:14px;
 border-radius:25px;
 border:1px solid #ddd;
}

.categories{
 display:flex;
 gap:10px;
 padding:10px;
 overflow:auto;
}

.categories button{
 padding:10px 18px;
 border:0;
 border-radius:20px;
 background:white;
}

.feed{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
 padding:15px;
}

.card{
 background:white;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 3px 10px #ddd;
}

.card img{
 width:100%;
 height:230px;
 object-fit:cover;
}

.details{
 padding:12px;
}

.price{
 font-weight:bold;
 font-size:18px;
}

.discount{
 color:green;
 font-size:14px;
}

.shop{
 width:100%;
 padding:12px;
 border:none;
 background:#111;
 color:white;
 border-radius:10px;
 margin-top:10px;
}

.logo{
 color:#ff4d6d;
}

</style>

</head>

<body>

<header>
<span class="logo">✨</span> TrendyFits
</header>


<div class="search">
<input placeholder="Search your style...">
</div>


<div class="categories">
<button>🔥 Trending</button>
<button>Men</button>
<button>Women</button>
<button>Shoes</button>
<button>Accessories</button>
</div>


<div class="feed">


<div class="card">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b">
<div class="details">
<h3>Street Style Look</h3>
<p class="price">₹999</p>
<p class="discount">30% OFF</p>
<button class="shop">Shop Now</button>
</div>
</div>


<div class="card">
<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c">
<div class="details">
<h3>Trending Outfit</h3>
<p class="price">₹1499</p>
<p class="discount">40% OFF</p>
<a href="YOUR_AFFILIATE_LINK" class="shop">Shop Now</a>
</div>
</div>


<div class="card">
<img src="https://images.unsplash.com/photo-1523381294911-8d3cead13475">
<div class="details">
<h3>Premium Fashion</h3>
<p class="price">₹1999</p>
<p class="discount">25% OFF</p>
<button class="shop">Shop Now</button>
</div>
</div>


<div class="card">
<img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e">
<div class="details">
<h3>Daily Wear</h3>
<p class="price">₹799</p>
<p class="discount">35% OFF</p>
<button class="shop">Shop Now</button>
</div>
</div>


</div>

</body>
</html>
