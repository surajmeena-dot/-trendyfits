<!DOCTYPE html>
<html>
<head>
<title>TrendyFits | Fashion Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
margin:0;
background:#fafafa;
color:#222;
}

header{
background:#111;
color:white;
padding:22px;
text-align:center;
font-size:32px;
font-weight:bold;
}

.tagline{
text-align:center;
padding:10px;
font-size:14px;
color:#666;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:14px;
border-radius:25px;
border:1px solid #ddd;
}

.categories{
display:flex;
gap:10px;
padding:10px;
overflow-x:auto;
}

.categories button{
border:0;
background:white;
padding:10px 18px;
border-radius:25px;
}

.feed{
padding:15px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:0 2px 10px #ddd;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:12px;
}

.info h3{
margin:5px 0;
font-size:17px;
}

.price{
font-size:18px;
font-weight:bold;
}

.off{
color:green;
font-size:14px;
}

.shop{
display:block;
text-align:center;
background:#111;
color:white;
padding:12px;
border-radius:10px;
text-decoration:none;
margin-top:10px;
}

footer{
text-align:center;
padding:20px;
color:#777;
}

</style>

</head>

<body>

<header>
✨ TrendyFits
</header>

<div class="tagline">
Discover Trending Fashion & Shop Your Style
</div>


<div class="search">
<input placeholder="Search fashion...">
</div>


<div class="categories">
<button>🔥 Trending</button>
<button>👔 Men</button>
<button>👗 Women</button>
<button>👟 Shoes</button>
<button>👜 Accessories</button>
</div>


<div class="feed">


<div class="card">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b">
<div class="info">
<h3>Men Street Style</h3>
<p class="price">₹999</p>
<p class="off">30% OFF</p>

<a class="shop" href="https://fktr.in/Yj3jfzE">
Shop Now
</a>

</div>
</div>



<div class="card">
<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c">
<div class="info">
<h3>Women Trending Look</h3>
<p class="price">₹1499</p>
<p class="off">40% OFF</p>

<a class="shop" href="PASTE_YOUR_EARNKARO_LINK">
Shop Now
</a>

</div>
</div>



<div class="card">
<img src="https://images.unsplash.com/photo-1523381294911-8d3cead13475">
<div class="info">
<h3>Premium Outfit</h3>
<p class="price">₹1999</p>
<p class="off">25% OFF</p>

<a class="shop" href="PASTE_YOUR_EARNKARO_LINK">
Shop Now
</a>

</div>
</div>



<div class="card">
<img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e">
<div class="info">
<h3>Daily Fashion</h3>
<p class="price">₹799</p>
<p class="off">35% OFF</p>

<a class="shop" href="PASTE_YOUR_EARNKARO_LINK">
Shop Now
</a>

</div>
</div>


</div>


<footer>
© 2026 TrendyFits
</footer>

</body>
</html>
