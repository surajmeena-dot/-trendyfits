<!DOCTYPE html>
<html>
<head>
<title>TrendyFits</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.category{
  display:flex;
  gap:10px;
  padding:15px;
  overflow:auto;
}

.category button{
  border:none;
  padding:10px 18px;
  border-radius:20px;
  background:white;
}

.feed{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px #ddd;
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.info{
  padding:12px;
}

.shop{
  background:#111;
  color:white;
  border:none;
  padding:10px;
  width:100%;
  border-radius:8px;
}
</style>

</head>

<body>

<header>
✨ TrendyFits
</header>

<div class="category">
<button>Men</button>
<button>Women</button>
<button>Shoes</button>
<button>Accessories</button>
</div>


<div class="feed">

<div class="card">
<img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b">
<div class="info">
<h3>Street Style Look</h3>
<p>₹999</p>
<button class="shop">Shop Now</button>
</div>
</div>


<div class="card">
<img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c">
<div class="info">
<h3>Trending Outfit</h3>
<p>₹1499</p>
<button class="shop">Shop Now</button>
</div>
</div>

</div>

</body>
</html>
